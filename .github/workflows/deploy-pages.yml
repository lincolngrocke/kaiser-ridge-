name: Deploy Pages (with retry)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy (attempt 1)
        id: a1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.a1.outcome == 'failure'
        run: echo "attempt 1 failed - waiting 20s"; sleep 20

      - name: Deploy (attempt 2)
        id: a2
        if: steps.a1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        run: echo "attempt 2 failed - waiting 45s"; sleep 45

      - name: Deploy (attempt 3)
        id: a3
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure' && steps.a3.outcome == 'failure'
        run: echo "attempt 3 failed - waiting 90s"; sleep 90

      - name: Deploy (attempt 4 - final)
        id: a4
        if: steps.a1.outcome == 'failure' && steps.a2.outcome == 'failure' && steps.a3.outcome == 'failure'
        uses: actions/deploy-pages@v4
